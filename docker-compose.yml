services:
  mysql:
    image: mysql:8.4
    container_name: el-realejo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: realejo_root
      MYSQL_DATABASE: el_realejo
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-prealejo_root']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
